# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "feature/**" ]
  pull_request:
    branches: [ "feature/**" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Temurin 17.0.20.1 still trusts the eMudhra roots (JDK-8395690, CVE-2026-114820).
    # Its aliases differ from Oracle's "[jdk]" names, so match on subject and fail if any remain.
    - name: Distrust eMudhra roots in the runner JDK
      run: |
        roots='^Owner: CN=(emSign ECC Root CA - G3|emSign Root CA - G1|emSign Root CA - G2|AAA Certificate Services),'
        listing="$RUNNER_TEMP/cacerts.txt"
        "$JAVA_HOME/bin/keytool" -list -v -cacerts -storepass changeit > "$listing"
        awk -v re="$roots" '/^Alias name: /{alias=substr($0,13)} $0 ~ re {print alias}' "$listing" \
          | while IFS= read -r alias; do "$JAVA_HOME/bin/keytool" -delete -cacerts -storepass changeit -alias "$alias"; done
        "$JAVA_HOME/bin/keytool" -list -v -cacerts -storepass changeit > "$listing"
        if grep -Eq "$roots" "$listing"; then echo "eMudhra roots still trusted" >&2; exit 1; fi

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    - name: Build with Gradle Wrapper
      run: ./gradlew clean build

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
